# Runs the PRE-BUILT images from GHCR. This is the file you use ON THE EC2 BOX.
# It does NOT build anything — it pulls the images GitHub Actions already built.
#
# Usage on EC2:
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# Requires a .env.production file next to this one (see .env.production.example).
services:
  backend:
    image: ghcr.io/aryan2364/v2e-backend:latest
    env_file: .env.production
    environment:
      PORT: 3001
      CORS_ORIGIN: https://v2e.rgbindia.com
      TZ: Asia/Kolkata
    ports:
      - "4300:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:3001,path:'/health'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - v2e_prod

  frontend:
    image: ghcr.io/aryan2364/v2e-frontend:latest
    environment:
      # Server-side rewrite target — reaches the backend over the compose network.
      BACKEND_URL: http://backend:3001
      TZ: Asia/Kolkata
    ports:
      - "3300:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:3000,path:'/'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - v2e_prod

networks:
  v2e_prod:
    driver: bridge
