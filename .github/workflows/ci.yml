# Continuous integration: type-check, lint, test and build both apps.
# Runs on every pull request and on every push to main. The image build/push
# workflow (deploy-images.yml) only starts after this one succeeds on main.
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding:
    name: UTF-8 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # tsc and nest build accept a Windows-1252 character in a source file; the dev
      # compiler (swc) does not and the app then fails to start. See the script header.
      - name: Check tracked files are valid UTF-8
        run: node scripts/check-utf8.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20          # matches node:20-alpine in the Dockerfiles
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci   # generate only; never connects
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint:check
      - name: Unit tests
        run: npm test -- --ci
      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholders so the production build has what it bakes in; no real service is contacted.
      NEXT_PUBLIC_WS_URL: http://localhost:3001
      BACKEND_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: test:unit runs .ts files through Node's built-in type
          # stripping, which Node 20 lacks. The Docker image stays on node:20.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci          # postinstall copies the pdf.js files into public/
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
